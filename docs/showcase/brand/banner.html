<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>BooBoard banner</title>
<style>
@font-face{font-family:"Fraunces";src:url("../../../assets/fonts/Fraunces.ttf");font-weight:100 900}
@font-face{font-family:"GoogleSansFlex";src:url("../../../assets/fonts/GoogleSansFlex.ttf");font-weight:100 1000}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:640px;overflow:hidden}
body{background:#E3F794;color:#111;font-family:"GoogleSansFlex","Segoe UI",system-ui,sans-serif;position:relative}
.blob{position:absolute;border-radius:50%}
.b1{width:560px;height:560px;left:-120px;top:70px;background:#D6EC7C;opacity:.7}
.b2{width:260px;height:260px;right:-70px;top:-90px;background:#EDFAB6}
.ghost{position:absolute;left:70px;top:90px;width:460px;height:460px;filter:drop-shadow(0 28px 28px rgba(17,17,17,.18))}
.copy{position:absolute;left:580px;top:0;height:640px;width:650px;display:flex;flex-direction:column;justify-content:center}
h1{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:136px;line-height:1;letter-spacing:-3px}
.tag{font-size:34px;font-weight:500;margin-top:20px;line-height:1.25}
.pills{display:flex;flex-wrap:wrap;gap:12px;margin-top:40px;max-width:640px}
.pill{background:#111;color:#E3F794;font-size:20px;font-weight:500;padding:11px 22px;border-radius:999px;white-space:nowrap}
.pill.l{background:rgba(17,17,17,.08);color:#111}
</style></head><body>
<div class="blob b1"></div><div class="blob b2"></div>
<img class="ghost" src="../../../assets/brand/pose_open.svg" alt="">
<div class="copy">
  <h1>BooBoard</h1>
  <div class="tag">The keyboard that keeps<br>your secrets.</div>
  <div class="pills">
    <span class="pill">No internet permission</span>
    <span class="pill l">18 languages</span>
    <span class="pill l">Offline voice &amp; translation</span>
    <span class="pill l">Open source (GPL-3.0)</span>
  </div>
</div>
</body></html>
