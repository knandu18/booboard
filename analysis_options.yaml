include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - lib/**/*.g.dart
    - lib/l10n/app_localizations*.dart # generated by gen-l10n (l10n.yaml)
    - build/**
    - android/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks
